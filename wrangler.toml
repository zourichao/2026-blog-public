main = ".open-next/worker.js"
name = "2025-blog-public"
compatibility_date = "2025-03-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[build]
command = "pnpm run build:cf"

# 本次改动：Cloudflare Observability 日志默认开启 → 默认完全关闭。
# 保留配置能力；如其他 GitHub 用户需要启用，可按 Cloudflare 文档重新开启。
[observability]
enabled = false

[observability.logs]
enabled = false
# 0 表示 0% 采样，不记录任何请求日志
head_sampling_rate = 0
# 不记录 Worker 调用日志
invocation_logs = false
# 不持久化日志
persist = false
